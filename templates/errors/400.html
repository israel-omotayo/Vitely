{% extends "base.html" %}
{% block title %}Bad request — Vitely{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4 py-16">
  <div class="w-full max-w-md text-center">

    <p class="text-7xl font-black text-border mb-4 tracking-tight select-none">400</p>

    <h1 class="text-xl font-bold text-text-base mb-2">Bad request</h1>
    <p class="text-sm text-muted leading-relaxed mb-8">
      Something about this request wasn't quite right.
      This can happen if a form submission was malformed or a link was tampered with.
    </p>

    <a href="{% url 'bookings:home' %}"
       class="inline-block bg-primary hover:bg-primary-dark text-white
              font-semibold text-sm px-6 py-2.5 rounded-xl transition-colors">
      Go home
    </a>

  </div>
</div>
{% endblock %}
