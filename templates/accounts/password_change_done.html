{% extends "base.html" %}
{% block title %}Password updated — Vitely{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md text-center">

    <span class="text-3xl font-bold text-primary tracking-tight">Vitely</span>

    <div class="bg-surface rounded-2xl border border-border shadow-sm px-8 py-10 mt-8">
      <div class="w-14 h-14 rounded-full bg-success/10 flex items-center justify-center mx-auto mb-5">
        <svg class="w-7 h-7 text-success" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
        </svg>
      </div>
      <h1 class="text-lg font-semibold text-text-base mb-2">Password updated</h1>
      <p class="text-sm text-muted mb-6">
        Your password has been changed successfully.
      </p>
      <a href="{% url 'dashboard:home' %}"
         class="inline-block bg-primary hover:bg-primary-dark text-white font-semibold text-sm px-6 py-2.5 rounded-lg transition-colors">
        Back to dashboard
      </a>
    </div>

  </div>
</div>
{% endblock %}
