{% extends "base.html" %}
{% block title %}Invite expired — Vitely{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md text-center">

    <span class="text-3xl font-bold text-primary tracking-tight">Vitely</span>

    <div class="bg-surface rounded-2xl border border-border shadow-sm px-8 py-10 mt-8">
      <div class="w-14 h-14 rounded-full bg-danger/10 flex items-center justify-center mx-auto mb-5">
        <svg class="w-7 h-7 text-danger" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
      </div>
      <h1 class="text-lg font-semibold text-text-base mb-2">This invite has expired</h1>
      <p class="text-sm text-muted leading-relaxed">
        Staff invite links expire after 48 hours or have already been used.
        Please ask the business owner to resend invite.
      </p>
    </div>

    <p class="text-xs text-muted mt-6">
      Already have an account?
      <a href="{% url 'accounts:login' %}" class="text-primary hover:text-primary-dark hover:underline">
        Sign in
      </a>
      <!-- No link shown here — login URL is private. Staff type it directly. -->
    </p>

  </div>
</div>
{% endblock %}
