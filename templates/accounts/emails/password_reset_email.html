<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body { margin:0; padding:0; background:#FAF7F4; font-family:'Helvetica',Arial,sans-serif; color:#2C2420; }
    .wrapper { max-width:560px; margin:0 auto; padding:2rem 1rem; }
    .logo { font-size:1.2rem; font-weight:700; color:#C17D5A; letter-spacing:-0.02em; margin-bottom:0.25rem; }
    .card { background:#fff; border-radius:14px; border:1px solid #EDE8E2; overflow:hidden; margin-top:1.25rem; }
    .card-body { padding:2rem 2rem 1.75rem; }
    h1 { margin:0 0 0.5rem; font-size:1.2rem; font-weight:600; color:#2C2420; }
    p { margin:0 0 1rem; font-size:0.9rem; line-height:1.6; color:#9C8880; }
    .action-area { margin:1.5rem 0; text-align:center; }
    .btn { display:inline-block; background:#C17D5A; color:#fff !important; text-decoration:none; padding:0.75rem 2rem; border-radius:8px; font-size:0.9rem; font-weight:600; }
    .divider { border:none; border-top:1px solid #EDE8E2; margin:1.5rem 0; }
    .notice { font-size:0.8rem; color:#9C8880; line-height:1.5; }
    .footer { font-size:0.75rem; color:#9C8880; text-align:center; margin-top:1.5rem; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="logo">Vitely</div>
    <div class="card">
      <div class="card-body">
        <h1>Reset your password</h1>
        <p>We received a request to reset the password for your Vitely account. Click the button below to choose a new one.</p>
        <div class="action-area">
          <a href="{{ protocol }}://{{ domain }}{% url 'accounts:password_reset_confirm' uidb64=uid token=token %}" class="btn">
            Reset password
          </a>
        </div>
        <hr class="divider">
        <p class="notice">If you didn't request this, you can safely ignore this email. Your password won't change.</p>
      </div>
    </div>
    <div class="footer">
      <p>© Vitely · The Vitely Team</p>
    </div>
  </div>
</body>
</html>
