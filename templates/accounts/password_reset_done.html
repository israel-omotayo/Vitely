{% extends "base.html" %}
{% block title %}Check your email | {{ business.name|default:"Oak & Motion Clinic" }}{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md text-center">

    <span class="text-3xl font-bold text-primary tracking-tight">Vitely</span>

    <div class="bg-surface rounded-2xl border border-border shadow-sm px-8 py-10 mt-8">
      <div class="w-14 h-14 rounded-full bg-primary/10 flex items-center justify-center mx-auto mb-5">
        <svg class="w-7 h-7 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
        </svg>
      </div>
      <h1 class="text-lg font-semibold text-text-base mb-2">Check your inbox</h1>
      <p class="text-sm text-muted leading-relaxed">
        If an account exists with that email address, you'll receive a password reset link shortly.
      </p>
      <br>
      <a href="{% url 'accounts:login' %}" class="text-xs text-primary hover:text-primary-dark hover:underline">
      Back to sign in
      </a>
    </div>

  </div>
</div>
{% endblock %}
